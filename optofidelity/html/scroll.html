<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src='http://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js'
          type='text/javascript'></script>

  <title>Scroll Latency Test</title>
  <style>
    div.block  {
      width: 100%;
      height: 1024px;
      cursor: pointer;
    }
    div#black {
      background-color: black;
    }
    div#white {
      background-color: white;
    }
    body {
      margin: 0;
    }
  </style>
  <script>
    function scroll_to_click(event) {
      $("body").animate({
          scrollTop: $("#black").height - event.pageY + document.body.scrollTop
      }, 0);
    }
    $(document).ready(function() {
      $("div.block").click(scroll_to_click)
    })
  </script>
</head>

<body>
  <div id="black" class="block">&nbsp;</div>
  <div id="white" class="block">&nbsp;</div>
</body>

</html>
